{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Pokemon Battle{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav>
        <a href="/">Início</a>
        {% if user.is_authenticated %}
            <span>Olá, {{ user.username }}</span>
            <a href="{% url 'logout' %}">Sair</a>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
            <a href="{% url 'register' %}">Criar conta</a>
        {% endif %}
    </nav>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>
</body>
</html>
